<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <circle cx="160" cy="256" r="100" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="160" cy="256" r="85" fill="#38bdf8" />
  <!-- Monogram TT -->
  <text x="160" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle">TT</text>
  <!-- Tamil Text and TEST -->
  <text x="290" y="250" font-family="'Mukta Malar', 'Noto Sans Tamil', system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff">தமிழ்</text>
  <text x="295" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="6" fill="#cbd5e1">TEST</text>
</svg>
